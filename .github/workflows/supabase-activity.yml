name: Supabase Activity Check

on:
  schedule:
    # Runs once daily at 03:45 UTC (approximately once every 24 hours)
    - cron: '45 3 * * *'
  workflow_dispatch:

concurrency:
  group: supabase-activity
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Supabase Daily Activity Ping
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Perform Lightweight Activity Check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          echo "Neram Supabase activity check started"

          # 1. Validate secrets exist
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_URL or SUPABASE_ANON_KEY is not configured in repository secrets."
            exit 1
          fi

          # 2. Sanitize URL: strip variable prefixes, quotes, whitespace, and newlines
          URL=$(echo "$SUPABASE_URL" | tr -d '\r\n[:space:]"' | tr -d "'")
          URL="${URL#*EXPO_PUBLIC_SUPABASE_URL=}"
          URL="${URL#*SUPABASE_URL=}"
          if [[ ! "$URL" =~ ^https?:// ]]; then
            URL="https://${URL}"
          fi
          URL="${URL%/}"

          # 3. Sanitize Key: strip variable prefixes, quotes, whitespace, and newlines
          KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d '\r\n[:space:]"' | tr -d "'")
          KEY="${KEY#*EXPO_PUBLIC_SUPABASE_ANON_KEY=}"
          KEY="${KEY#*SUPABASE_ANON_KEY=}"

          # 4. Perform lightweight GET request against profiles table (limit=1)
          set +e
          HTTP_STATUS=$(curl -s -S -o response.txt -w "%{http_code}" \
            -X GET \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            "${URL}/rest/v1/profiles?select=user_id&limit=1" 2>curl_err.log)
          CURL_EXIT=$?
          set -e

          if [ $CURL_EXIT -ne 0 ]; then
            echo "Supabase request failed: network or URL format error (curl code $CURL_EXIT)"
            if [ -s curl_err.log ]; then
              sed -E 's/Bearer [^ ]+/Bearer ***/g' curl_err.log
            fi
            exit 1
          fi

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Supabase request successful"
            echo "HTTP status: $HTTP_STATUS"
            echo "Activity check completed"
            exit 0
          else
            echo "Supabase request failed"
            echo "HTTP status: $HTTP_STATUS"
            echo "Key length received: ${#KEY} chars (expected 208 chars for this project's anon key)"
            if [ -s response.txt ]; then
              echo "Gateway response: $(cat response.txt)"
            fi
            if [ "$HTTP_STATUS" -eq 401 ]; then
              echo "Hint: HTTP 401 indicates that SUPABASE_ANON_KEY in GitHub Secrets does not match the valid anon key."
            fi
            exit 1
          fi
