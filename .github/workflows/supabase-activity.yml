name: Supabase Activity Check

on:
  schedule:
    # Runs once daily at 03:45 UTC (approximately once every 24 hours)
    - cron: '45 3 * * *'
  workflow_dispatch:

concurrency:
  group: supabase-activity
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Supabase Daily Activity Ping
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Perform Lightweight Activity Check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          echo "Neram Supabase activity check started"

          # 1. Validate secrets exist
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_URL or SUPABASE_ANON_KEY is not configured in repository secrets."
            exit 1
          fi

          # 2. Sanitize URL: strip variable prefix, surrounding quotes, whitespace, and carriage returns
          URL=$(echo "$SUPABASE_URL" | sed -E 's/^[A-Za-z0-9_]*=//' | tr -d '\r\n"' | tr -d "'" | xargs)
          if [[ ! "$URL" =~ ^https?:// ]]; then
            URL="https://${URL}"
          fi
          URL="${URL%/}"

          # 3. Sanitize Key: strip variable prefix, surrounding quotes, whitespace, and carriage returns
          KEY=$(echo "$SUPABASE_ANON_KEY" | sed -E 's/^[A-Za-z0-9_]*=//' | tr -d '\r\n"' | tr -d "'" | xargs)

          # 4. Perform lightweight GET request against profiles table (limit=1)
          # Use -w to extract HTTP status code, capturing curl exit code cleanly
          set +e
          HTTP_STATUS=$(curl -s -S -o /dev/null -w "%{http_code}" \
            -X GET \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            "${URL}/rest/v1/profiles?select=user_id&limit=1" 2>curl_err.log)
          CURL_EXIT=$?
          set -e

          if [ $CURL_EXIT -ne 0 ]; then
            echo "Supabase request failed: network or URL format error (curl code $CURL_EXIT)"
            if [ -s curl_err.log ]; then
              sed -E 's/Bearer [^ ]+/Bearer ***/g' curl_err.log
            fi
            exit 1
          fi

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Supabase request successful"
            echo "HTTP status: $HTTP_STATUS"
            echo "Activity check completed"
            exit 0
          else
            echo "Supabase request failed"
            echo "HTTP status: $HTTP_STATUS"
            exit 1
          fi
